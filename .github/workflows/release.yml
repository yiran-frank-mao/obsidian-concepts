name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify tag matches manifest
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          test "$GITHUB_REF_NAME" = "$VERSION" || test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
